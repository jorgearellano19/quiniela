name: quiniela-foundation

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quiniela
      POSTGRES_PASSWORD: quiniela
      POSTGRES_USER: quiniela
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiniela -d quiniela"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - quiniela-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  quiniela-postgres-data:
